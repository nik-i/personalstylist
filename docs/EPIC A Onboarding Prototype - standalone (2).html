document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"29aebea6-b1bb-4ac7-99fe-462c489ae29a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet data-dc-atomics=\"\">\n<style>/* Gestalt — font family tokens\n   Gestalt ships no bundled webfont; it uses the platform system stack. */\n:root {\n  --font-family-default: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --font-family-code: 'SF Mono', Menlo, Consolas, Courier, monospace;\n}\n\n/* Gestalt — color tokens (classic theme)\n   Base palette + light-mode semantic aliases.\n   Dark-mode semantic overrides live in theme-dark.css. */\n:root {\n  /* ── Base palette ─────────────────────────────── */\n  /* Red — \"Pushpin\" (brand) */\n  --color-red-pushpin-0: #FFF7F7;\n  --color-red-pushpin-50: #FFEBEB;\n  --color-red-pushpin-100: #FFE0E0;\n  --color-red-pushpin-200: #FCBBBB;\n  --color-red-pushpin-300: #F47171;\n  --color-red-pushpin-400: #EB4242;\n  --color-red-pushpin-450: #E60023;  /* Pinterest red */\n  --color-red-pushpin-500: #CC0000;\n  --color-red-pushpin-600: #B60000;\n  --color-red-pushpin-700: #9B0000;\n  --color-red-pushpin-800: #800000;\n  --color-red-pushpin-900: #660000;\n\n  /* Pink — \"Flaminglow\" */\n  --color-pink-flaminglow-100: #FFDFE9;\n  --color-pink-flaminglow-200: #FFBED2;\n  --color-pink-flaminglow-450: #EE376A;\n  --color-pink-flaminglow-500: #DE2C62;\n\n  /* Blue — \"Skycicle\" */\n  --color-blue-skycicle-0: #F7FBFF;\n  --color-blue-skycicle-50: #E6F4FF;\n  --color-blue-skycicle-100: #D7EDFF;\n  --color-blue-skycicle-200: #ABDBFF;\n  --color-blue-skycicle-300: #75BFFF;\n  --color-blue-skycicle-400: #45A3FE;\n  --color-blue-skycicle-450: #007CFF;\n  --color-blue-skycicle-500: #0074E8;\n  --color-blue-skycicle-600: #005FCB;\n  --color-blue-skycicle-700: #004BA9;\n  --color-blue-skycicle-800: #003C96;\n  --color-blue-skycicle-900: #002966;\n\n  /* Teal — \"Spabattical\" */\n  --color-teal-spabattical-100: #CCF6EE;\n  --color-teal-spabattical-450: #009990;\n  --color-teal-spabattical-500: #00857C;\n\n  /* Green — \"Matchacado\" */\n  --color-green-matchacado-100: #C3F9C2;\n  --color-green-matchacado-300: #6BEC8C;\n  --color-green-matchacado-400: #39D377;\n  --color-green-matchacado-450: #1DAD65;\n  --color-green-matchacado-500: #008753;\n  --color-green-matchacado-600: #005F3E;\n  --color-green-matchacado-700: #00422C;\n\n  /* Purple — \"Mysticool\" */\n  --color-purple-mysticool-100: #E9E4FF;\n  --color-purple-mysticool-300: #B190FF;\n  --color-purple-mysticool-450: #8A39FA;\n  --color-purple-mysticool-500: #812AE7;\n  --color-purple-mysticool-700: #550AA9;\n\n  /* Orange — \"Firetini\" */\n  --color-orange-firetini-100: #FFE4C1;\n  --color-orange-firetini-450: #FF5B45;\n  --color-orange-firetini-500: #DE3700;\n\n  /* Yellow — \"Caramellow\" */\n  --color-yellow-caramellow-100: #FFFD92;\n  --color-yellow-caramellow-300: #FDC900;\n  --color-yellow-caramellow-400: #E18D00;\n  --color-yellow-caramellow-500: #BD5B00;\n\n  /* Neutrals */\n  --color-white-mochimalist-0: #FFFFFF;\n  --color-gray-roboflow-50: #F9F9F9;\n  --color-gray-roboflow-100: #F1F1F1;\n  --color-gray-roboflow-200: #E9E9E9;\n  --color-gray-roboflow-300: #CDCDCD;\n  --color-gray-roboflow-400: #A5A5A5;\n  --color-gray-roboflow-500: #767676;\n  --color-gray-roboflow-550: #5F5F5F;\n  --color-gray-roboflow-600: #4A4A4A;\n  --color-gray-roboflow-700: #2B2B2B;\n  --color-gray-roboflow-800: #191919;\n  --color-black-cosmicore-900: #111111;\n\n  /* ── Semantic — light mode ────────────────────── */\n  /* Text */\n  --color-text-default: var(--color-black-cosmicore-900);\n  --color-text-subtle: var(--color-gray-roboflow-500);\n  --color-text-success: var(--color-green-matchacado-600);\n  --color-text-error: var(--color-red-pushpin-500);\n  --color-text-warning: var(--color-yellow-caramellow-500);\n  --color-text-disabled: var(--color-gray-roboflow-400);\n  --color-text-inverse: var(--color-white-mochimalist-0);\n  --color-text-shopping: var(--color-blue-skycicle-500);\n  --color-text-link: var(--color-blue-skycicle-700);\n\n  /* Icon */\n  --color-icon-default: var(--color-black-cosmicore-900);\n  --color-icon-subtle: var(--color-gray-roboflow-500);\n  --color-icon-success: var(--color-green-matchacado-600);\n  --color-icon-error: var(--color-red-pushpin-500);\n  --color-icon-warning: var(--color-yellow-caramellow-500);\n  --color-icon-info: var(--color-blue-skycicle-500);\n  --color-icon-recommendation: var(--color-purple-mysticool-500);\n  --color-icon-disabled: var(--color-gray-roboflow-400);\n  --color-icon-inverse: var(--color-white-mochimalist-0);\n  --color-icon-brand-primary: var(--color-red-pushpin-450);\n\n  /* Background */\n  --color-background-default: var(--color-white-mochimalist-0);\n  --color-background-elevation-accent: var(--color-gray-roboflow-100);\n  --color-background-brand: var(--color-red-pushpin-450);\n  --color-background-primary-base: var(--color-red-pushpin-450);\n  --color-background-primary-strong: var(--color-red-pushpin-600);\n  --color-background-primary-weak: var(--color-red-pushpin-300);\n  --color-background-secondary-base: var(--color-gray-roboflow-200);\n  --color-background-secondary-strong: var(--color-gray-roboflow-400);\n  --color-background-secondary-weak: var(--color-gray-roboflow-300);\n  --color-background-tertiary-base: var(--color-gray-roboflow-500);\n  --color-background-selected-base: var(--color-black-cosmicore-900);\n  --color-background-inverse-base: var(--color-black-cosmicore-900);\n  --color-background-info-base: var(--color-blue-skycicle-500);\n  --color-background-info-weak: var(--color-blue-skycicle-100);\n  --color-background-error-base: var(--color-red-pushpin-500);\n  --color-background-error-weak: var(--color-red-pushpin-100);\n  --color-background-warning-base: var(--color-yellow-caramellow-500);\n  --color-background-warning-weak: var(--color-orange-firetini-100);\n  --color-background-success-base: var(--color-green-matchacado-500);\n  --color-background-success-weak: var(--color-green-matchacado-100);\n  --color-background-recommendation-base: var(--color-purple-mysticool-500);\n  --color-background-recommendation-weak: var(--color-purple-mysticool-100);\n  --color-background-education: var(--color-blue-skycicle-500);\n  --color-background-wash-dark: rgba(0, 0, 0, 0.8);\n  --color-background-wash-light: rgba(255, 255, 255, 0.9);\n  --color-background-shopping: var(--color-blue-skycicle-500);\n\n  /* Border */\n  --color-border-container: var(--color-gray-roboflow-300);\n  --color-border-default: var(--color-gray-roboflow-500);\n  --color-border-error: var(--color-red-pushpin-500);\n  --color-border-focus: rgba(0, 132, 255, 0.5);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 4px var(--color-border-focus);\n}\n\n/* Gestalt — dark-mode semantic overrides (classic theme) */\n[data-theme=\"dark\"] {\n  /* Text */\n  --color-text-default: var(--color-white-mochimalist-0);\n  --color-text-subtle: var(--color-gray-roboflow-400);\n  --color-text-success: var(--color-green-matchacado-400);\n  --color-text-error: var(--color-red-pushpin-300);\n  --color-text-warning: var(--color-yellow-caramellow-400);\n  --color-text-disabled: var(--color-gray-roboflow-600);\n  --color-text-inverse: var(--color-black-cosmicore-900);\n  --color-text-shopping: var(--color-blue-skycicle-300);\n  --color-text-link: var(--color-blue-skycicle-400);\n\n  /* Icon */\n  --color-icon-default: var(--color-white-mochimalist-0);\n  --color-icon-subtle: var(--color-gray-roboflow-400);\n  --color-icon-success: var(--color-green-matchacado-400);\n  --color-icon-error: var(--color-red-pushpin-300);\n  --color-icon-warning: var(--color-yellow-caramellow-400);\n  --color-icon-info: var(--color-blue-skycicle-300);\n  --color-icon-recommendation: var(--color-purple-mysticool-300);\n  --color-icon-disabled: var(--color-gray-roboflow-600);\n  --color-icon-inverse: var(--color-black-cosmicore-900);\n\n  /* Background — dark surfaces build up in gray steps */\n  --color-background-default: var(--color-black-cosmicore-900);\n  --color-background-elevation-accent: var(--color-gray-roboflow-800);\n  --color-background-elevation-floating: var(--color-gray-roboflow-700);\n  --color-background-elevation-raised: var(--color-gray-roboflow-600);\n  --color-background-secondary-base: var(--color-gray-roboflow-500);\n  --color-background-tertiary-base: var(--color-gray-roboflow-300);\n  --color-background-selected-base: var(--color-gray-roboflow-200);\n  --color-background-inverse-base: var(--color-gray-roboflow-50);\n  --color-background-info-base: var(--color-blue-skycicle-300);\n  --color-background-info-weak: var(--color-blue-skycicle-800);\n  --color-background-error-base: var(--color-red-pushpin-300);\n  --color-background-error-weak: var(--color-red-pushpin-900);\n  --color-background-warning-base: var(--color-yellow-caramellow-300);\n  --color-background-warning-weak: var(--color-yellow-caramellow-500);\n  --color-background-success-base: var(--color-green-matchacado-300);\n  --color-background-success-weak: var(--color-green-matchacado-700);\n  --color-background-recommendation-base: var(--color-purple-mysticool-300);\n  --color-background-recommendation-weak: var(--color-purple-mysticool-700);\n  --color-background-education: var(--color-blue-skycicle-300);\n\n  /* Border */\n  --color-border-container: var(--color-gray-roboflow-500);\n  --color-border-default: var(--color-gray-roboflow-300);\n  --color-border-error: var(--color-red-pushpin-300);\n}\n\n/* Elevation surfaces default to page background in light mode.\n   Cards use shadows for elevation there; in dark, gray steps do the work. */\n:root {\n  --color-background-elevation-floating: var(--color-white-mochimalist-0);\n  --color-background-elevation-raised: var(--color-white-mochimalist-0);\n}\n\n/* Gestalt — typography tokens */\n:root {\n  /* Font-size ramp (Text/Heading sizes) */\n  --font-size-100: 12px;\n  --font-size-200: 14px;   /* body default */\n  --font-size-300: 16px;\n  --font-size-400: 20px;\n  --font-size-500: 28px;\n  --font-size-600: 36px;\n\n  /* Weights */\n  --font-weight-normal: 400;\n  --font-weight-semibold: 600;\n  --font-weight-bold: 700;\n\n  /* Line heights */\n  --font-line-height-tight: 1.2;   /* headings */\n  --font-line-height-normal: 1.5;  /* body */\n\n  /* Letter spacing */\n  --font-letter-spacing-tight: -0.32px;  /* large headings */\n}\n\n/* Gestalt — spacing tokens (4px grid) */\n:root {\n  --space-0: 0px;\n  --space-100: 4px;\n  --space-200: 8px;\n  --space-300: 12px;\n  --space-400: 16px;\n  --space-500: 20px;\n  --space-600: 24px;\n  --space-700: 28px;\n  --space-800: 32px;\n  --space-900: 36px;\n  --space-1000: 40px;\n  --space-1100: 44px;\n  --space-1200: 48px;\n  --space-1300: 52px;\n  --space-1400: 56px;\n  --space-1500: 60px;\n  --space-1600: 64px;\n}\n\n/* Gestalt — rounding, elevation & motion tokens */\n:root {\n  /* Rounding scale */\n  --rounding-0: 0px;\n  --rounding-100: 4px;\n  --rounding-200: 8px;\n  --rounding-300: 12px;\n  --rounding-400: 16px;\n  --rounding-500: 20px;\n  --rounding-600: 24px;\n  --rounding-700: 28px;\n  --rounding-800: 32px;\n  --rounding-pill: 999px;\n  --rounding-circle: 50%;\n\n  /* Elevation shadows (light mode) */\n  --elevation-floating: 0 0 8px 0 rgba(0, 0, 0, 0.10);\n  --elevation-raised-top: 0 2px 8px 0 rgba(0, 0, 0, 0.12);\n  --elevation-raised-bottom: 0 -2px 8px 0 rgba(0, 0, 0, 0.12);\n  --elevation-datepicker: 0 2px 8px 0 rgba(0, 0, 0, 0.12), 0 4px 12px 0 rgba(0, 0, 0, 0.10);\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --dur-fast: 100ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 300ms;   /* @kind other */\n}\n\n/* In dark mode Gestalt drops the floating shadow (gray steps carry elevation) */\n[data-theme=\"dark\"] {\n  --elevation-floating: none;\n  --elevation-raised-top: none;\n  --elevation-raised-bottom: none;\n}\n\n\n/* Base page defaults */\nbody {\n  margin: 0;\n  font-family: var(--font-family-default);\n  font-size: var(--font-size-300);\n  line-height: var(--font-line-height-normal);\n  color: var(--color-text-default);\n  background: var(--color-background-default);\n  -webkit-font-smoothing: antialiased;\n}\na { color: var(--color-text-link); }\na:hover { color: var(--color-blue-skycicle-900); }\n*, *::before, *::after { box-sizing: border-box; }\n<\u002Fstyle>\n<style>\nbody{margin:0;background:var(--color-background-elevation-accent);font-family:var(--font-family-default)}\na{color:var(--color-background-primary-base)}a:hover{color:var(--color-background-primary-strong)}\n@keyframes frkUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@keyframes frkDot{0%,80%,100%{opacity:.25}40%{opacity:1}}\n@keyframes frkScan{from{width:6%}to{width:94%}}\n@keyframes frkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}\n@keyframes frkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}\n@keyframes frkBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}\n@keyframes frkTalk{0%,100%{transform:translateX(-50%) scaleY(0.5)}50%{transform:translateX(-50%) scaleY(1.2)}}\n@keyframes frkRing{0%{transform:scale(1);opacity:0.5}100%{transform:scale(2.1);opacity:0}}\n@keyframes frkBar{0%,100%{transform:scaleY(0.28)}50%{transform:scaleY(1)}}\n@keyframes frkCap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n@keyframes frkSheet{from{transform:translateY(100%)}to{transform:none}}\n@keyframes frkFade{from{opacity:0}to{opacity:1}}\ninput{outline:none}\ninput:focus{box-shadow:var(--focus-ring)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<input type=\"file\" accept=\"image/*\" multiple=\"multiple\" ref=\"{{ importFileInputRef }}\" sc-camel-on-change=\"{{ onImportFilesChosen }}\" style=\"display:none;\">\n<div data-theme=\"{{ themeAttr }}\" style=\"min-height:1 'This weekend'] },\n          { key: 'place', q: 'Where are you headed?', opts: ['The office', 'A restaurant', 'Outdoors', \"Someone's place\"] },\n        ];\n        const idx = Math.min(s.briefStep, BRIEF_Q.length - 1);\n        const bq = BRIEF_Q[idx];\n        const briefChips = bq.opts.map((label) => ({\n          label,\n          onTap: () => this.setState((st) => {\n            const brief = { ...st.brief, [bq.key]: label };\n            const next = st.briefStep + 1;\n            if (next >= BRIEF_Q.length) {\n              clearTimeout(this._styleT);\n              this._styleT = setTimeout(() => { this.go('done'); this.startRec(); }, 2300);\n              return { brief, styling: true };\n            }\n            return { brief, briefStep: next };\n          }),\n        }));\n        const briefSummary = BRIEF_Q.filter((q) => s.brief[q.key]).map((q) => s.brief[q.key]);\n        return {\n          isBrief: s.screen === 'brief',\n          briefQuestion: bq.q, briefStepLabel: `Question ${idx + 1} of ${BRIEF_Q.length}`,\n          briefChips, briefSummary, briefHasSummary: briefSummary.length > 0,\n          briefStyling: s.styling, briefAsking: !s.styling, briefQKey: 'q' + idx,\n        };\n      })(),\n      // taste\n      tasteTiles, tasteDisabled: tasteN === 0, tasteReadback: tasteN >= 2,\n      tasteCountLine: `${tasteN} selected · private to you, never shared`,\n      tasteSaveLabel: tasteN ? `Save taste — ${tasteN} photo${tasteN > 1 ? 's' : ''}` : 'Pick a photo or two',\n      saveTaste: () => { this.setState((st) => ({ hubDone: { ...st.hubDone, taste: true } })); this.go('hub'); this.pop('Taste saved — noted, chic'); },\n      // fit\n      sizes, shapes, areas,\n      saveFit: () => { this.setState((st) => ({ hubDone: { ...st.hubDone, fit: true } })); this.go('hub'); this.pop('Fit saved — editable anytime'); },\n      // shops\n      budgets, shopContexts,\n      saveShops: () => { this.setState((st) => ({ hubDone: { ...st.hubDone, shops: true } })); this.go('hub'); this.pop('Shops saved — recs get sharper'); },\n      // done — weather / footwear / calendar\n      ...(() => {\n        const WEATHER = {\n          'United Kingdom': { city: 'London', temp: '12°', cond: 'light drizzle', layer: 'olive trench', note: 'showers likely by 3pm' },\n          'United States': { city: 'New York', temp: '18°', cond: 'crisp and clear', layer: 'camel blazer', note: 'cooler after sunset' },\n          'France': { city: 'Paris', temp: '15°', cond: 'grey, breezy', layer: 'trench', note: 'wind picks up this evening' },\n          'Germany': { city: 'Berlin', temp: '10°', cond: 'cold, dry', layer: 'wool coat', note: 'frost overnight' },\n          'Australia': { city: 'Sydney', temp: '24°', cond: 'warm and sunny', layer: 'no jacket needed', note: 'UV high midday' },\n        };\n        const w = WEATHER[s.country] || WEATHER['United Kingdom'];\n        const dayWord = { 'Right now': 'today', 'Tonight': 'tonight', 'Tomorrow': 'tomorrow', 'This weekend': 'Saturday' }[s.brief.time] || 'today';\n        const dayCap = dayWord.charAt(0).toUpperCase() + dayWord.slice(1);\n        const noJacket = /no jacket/i.test(w.layer);\n        const comfy = s.lookMode === 'comfy';\n        const mode = LOOK_MODE[s.lookMode] || LOOK_MODE.signature;\n        const shoeDefs = [\n          { id: 'walk', tag: \"If you'll walk\", ...WI.sneakers },\n          { id: 'easy', tag: 'If you barely walk', ...WI.heels },\n        ];\n        const comfyShoe = { id: 'comfy', ...WI.sneakers };\n        const shoeOptions = shoeDefs.map((sh) => {\n          const d = deco({ tone: sh.tone, photo: sh.photo }, 'shoe-' + sh.id, 'shoe');\n          return {\n            ...sh, ...d, selected: !comfy && s.shoePick === sh.id,\n            bd: (!comfy && s.shoePick === sh.id) ? 'var(--color-background-primary-base)' : 'var(--color-border-container)',\n            tagColor: (!comfy && s.shoePick === sh.id) ? 'var(--color-background-primary-base)' : 'var(--color-text-subtle)',\n            onTap: () => this.setState({ shoePick: sh.id, lookMode: comfy ? 'signature' : s.lookMode }),\n          };\n        });\n        const shoeTile = comfy ? comfyShoe : shoeDefs.find((sh) => sh.id === s.shoePick);\n        const bottom = BOTTOMS[s.bottomIdx];\n        const lookTypes = ['top', 'pants', 'outer'];\n        const lookTiles = [mode.top, bottom, mode.layer].map((it, i) => deco({ tone: it.tone, label: it.name, photo: it.photo }, 'look' + i, lookTypes[i]));\n        // refine chips\n        const refineChips = [\n          { label: 'Swap the bottom', onTap: () => { const ni = (s.bottomIdx + 1) % BOTTOMS.length; this.mayaSay(`Swapped in the ${BOTTOMS[ni].name.toLowerCase()} — top and shoes stay put. Different mood, same effort.`, { bottomIdx: ni }); } },\n          { label: 'Something comfier', onTap: () => this.mayaSay('Softened it up — olive trench, cream knit, blush trousers and white sneakers. Still looks considered.', { lookMode: 'comfy', bottomIdx: 3 }) },\n          { label: 'Change the shoes', onTap: () => { const np = s.shoePick === 'walk' ? 'easy' : 'walk'; this.mayaSay(np === 'walk' ? \"Back to the sneakers — good if you'll be on your feet.\" : \"Block heels it is — since you're barely walking.\", { shoePick: np, lookMode: comfy ? 'signature' : s.lookMode }); } },\n          { label: 'Warmer layer', onTap: () => this.mayaSay(`With this ${w.temp} in ${w.city}, I'd add the ${w.layer} — you'll be glad of it.`, {}) },\n          { label: 'Another option', onTap: () => { const nm = s.lookMode === 'evening' ? 'signature' : 'evening'; this.mayaSay(nm === 'evening' ? \"Here's an after-dark take — navy blazer over a white tee. Keeps your bottom and shoes.\" : 'Back to the camel — clean, warm, daytime.', { lookMode: nm }); } },\n        ];\n        const routeText = (raw) => {\n          const t = raw.toLowerCase();\n          if (/comf|cosy|cozy|relax|easy/.test(t)) return { maya: 'On it — olive trench, blush trousers, sneakers. Comfier but still pulled together.', patch: { lookMode: 'comfy', bottomIdx: 3 } };\n          if (/bottom|trouser|jean|denim|skirt|pant/.test(t)) { const ni = (s.bottomIdx + 1) % BOTTOMS.length; return { maya: `Swapped the bottom for the ${BOTTOMS[ni].name.toLowerCase()}. Top and shoes stay.`, patch: { bottomIdx: ni } }; }\n          if (/shoe|heel|flat|sneaker|boot/.test(t)) { const np = s.shoePick === 'walk' ? 'easy' : 'walk'; return { maya: np === 'easy' ? 'Switched to the block heels.' : 'Switched to the sneakers.', patch: { shoePick: np, lookMode: comfy ? 'signature' : s.lookMode } }; }\n          if (/dress|evening|night|fancy|smart/.test(t)) return { maya: \"Dressed it up — navy blazer over a white tee, after-dark energy.\", patch: { lookMode: 'evening' } };\n          return { maya: \"Tell me which part — the top, the bottom, the shoes — or say 'comfier' or 'dress it up' and I'll adjust.\", patch: {} };\n        };\n        const recCaptions = [\n          `It's ${w.temp} and ${w.cond} in ${w.city} ${dayWord}.`,\n          noJacket\n            ? `So I kept it light — no jacket, just sunglasses.`\n            : `So I layered the ${w.layer} over the ${mode.top.name.toLowerCase()} — you'll want it.`,\n          comfy\n            ? `Soft and easy, and it's all yours already — nothing to buy.`\n            : `Sneakers if you're walking, heels if not — and it's all yours already.`,\n          `Like it? Or tell me what you'd change — just say the word.`,\n        ];\n        // requests she fulfils each time you talk to her (voice)\n        this._refineSeq = [\n          { reply: `Swapped in the ${BOTTOMS[(s.bottomIdx + 1) % BOTTOMS.length].name.toLowerCase()} — top and shoes stay put.`, patch: { bottomIdx: (s.bottomIdx + 1) % BOTTOMS.length } },\n          { reply: 'Softened it up — cardigan, cotton tee, wide-leg trousers and sneakers. Still considered.', patch: { lookMode: 'comfy', bottomIdx: 3 } },\n          { reply: s.shoePick === 'walk' ? 'Block heels it is — since you asked.' : \"Back to the flats — easier on your feet.\", patch: { shoePick: s.shoePick === 'walk' ? 'easy' : 'walk', lookMode: comfy ? 'signature' : s.lookMode } },\n          { reply: s.lookMode === 'evening' ? 'Back to the camel — clean, warm, daytime.' : \"Here's an after-dark take — wine blazer over a silk cami.\", patch: { lookMode: s.lookMode === 'evening' ? 'signature' : 'evening' } },\n        ];\n        const ri = Math.min(s.recCaptionIndex, recCaptions.length - 1);\n        let recCaption, recCaptionKey;\n        if (s.recListening) { recCaption = 'Listening…'; recCaptionKey = 'listen'; }\n        else if (s.lastReply) { recCaption = s.lastReply; recCaptionKey = 'reply' + s.replyCount; }\n        else { recCaption = recCaptions[ri]; recCaptionKey = 'r' + ri; }\n        return {\n          lookOverline: s.brief.occasion ? `For your ${s.brief.occasion.toLowerCase()} · ${dayWord}` : 'Your first look',\n          lookHeadline: mode.headline,\n          recCaption, recCaptionKey,\n          recSpeaking: s.recSpeaking, recIdle: !s.recSpeaking,\n          startListen: () => this.startListen(),\n          loveIt: () => this.pop('Marked as worn — très chic'),\n          lookPieceLine: comfy ? mode.line : `4 pieces with the ${shoeTile.name.toLowerCase()} — ${mode.line}`,\n          lookTiles, shoeOptions,\n          lookBig: lookTiles[0], lookMid: lookTiles[1], lookLayer: lookTiles[2],\n          // chat widget\n          chatOpen: s.chatOpen, chatClosed: !s.chatOpen,\n          openChat: () => this.openChat(),\n          closeChat: () => this.setState({ chatOpen: false }),\n          chatMsgs: s.chatMsgs.map((m) => ({\n            text: m.text,\n            align: m.me ? 'flex-end' : 'flex-start',\n            bg: m.me ? 'var(--color-background-inverse-base)' : 'var(--color-background-default)',\n            fg: m.me ? 'var(--color-text-inverse)' : 'var(--color-text-default)',\n            border: m.me ? 'none' : '1px solid var(--color-border-container)',\n            brr: m.me ? '6px' : '18px',\n            blr: m.me ? '18px' : '6px',\n          })),\n          refineChips,\n          chatDraft: s.chatDraft,\n          onChatDraft: (e) => { const v = e.target.value; this.setState({ chatDraft: v }); },\n          chatEndRef: (el) => { this._chatEnd = el; },\n          sendChat: () => { const t = s.chatDraft.trim(); if (!t) return; const r = routeText(t); this.setState({ chatDraft: '' }); this.pushChat(t, r.maya, r.patch); },\n          onChatKey: (e) => { if (e.key !== 'Enter') return; e.preventDefault(); const t = s.chatDraft.trim(); if (!t) return; const r = routeText(t); this.setState({ chatDraft: '' }); this.pushChat(t, r.maya, r.patch); },\n          saveToCal: () => { this.setState({ savedToCal: true }); this.pop(`Saved to ${dayCap}`); },\n          savedToCal: s.savedToCal, notSavedToCal: !s.savedToCal,\n          calBg: s.savedToCal ? 'var(--color-background-success-weak)' : 'var(--color-background-default)',\n          calBd: s.savedToCal ? 'var(--color-background-success-weak)' : 'var(--color-border-default)',\n          calIconBg: s.savedToCal ? 'var(--color-background-success-base)' : 'var(--color-background-elevation-accent)',\n          calIconFg: s.savedToCal ? 'var(--color-text-inverse)' : 'var(--color-text-subtle)',\n          calTitle: s.savedToCal ? `Saved to ${dayCap}` : `Save this look to ${dayCap}`,\n          calSub: s.savedToCal ? 'Find it under that day, anytime.' : 'So you can pull it back up on the day.',\n          doneAssist: noJacket\n            ? '\"Told you your wardrobe was plenty. I\\u2019ll adjust if the weather turns.\"'\n            : `\"I\\u2019ll swap the layer if ${w.city} surprises us — check back on the day.\"`,\n        };\n      })(),\n      wearIt: () => this.pop('Marked as worn — très chic'),\n      tagFront, tagBack,\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
